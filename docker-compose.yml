services:
  db:
    image: postgres:16-alpine
    container_name: rep4-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ${POSTGRES_DB:-rep4db}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    # Azure DevOps sets IMAGE_REPOSITORY and IMAGE_TAG before deployment.
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}/rep4-connect:${IMAGE_TAG:?Set IMAGE_TAG}

    # Retain build settings for authorized local development builds.
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rep4-app
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production

      # Set this as a secret/runtime variable on the deployment host.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

